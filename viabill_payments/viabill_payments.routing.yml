viabill_payments.callback:
  path: '/payment/viabill/callback'
  defaults:
    _controller: '\Drupal\viabill_payments\Controller\ViaBillController::callback'
  requirements:
    _access: 'TRUE'
  methods: [POST]

viabill_payments.account_form:
  path: '/admin/config/viabill/account'
  defaults:
    _form: '\Drupal\viabill_payments\PluginForm\ViaBillAccountForm'
    _title: 'ViaBill Account Credentials'
  requirements:
    _permission: 'administer commerce_payment_gateway'
